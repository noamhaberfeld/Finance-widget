<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --card-bg: #131b2e;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
    }

    .btn:hover { border-color: var(--accent); }

    #error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticker-symbol {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .ticker-name {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .price-val {
      font-size: 1rem;
      text-align: right;
    }

    .price-change {
      font-size: 0.75rem;
      text-align: right;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .shimmer {
      background: linear-gradient(90deg, var(--card-bg) 0%, #1c273e 50%, var(--card-bg) 100%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    #edit-panel {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 2px solid var(--accent);
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      transition: bottom 0.3s ease;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
      z-index: 100;
    }

    #edit-panel.active { bottom: 0; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; text-align: left; font-size: 0.8rem; }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px;
      width: 100%;
      border-radius: 4px;
      font-family: inherit;
    }

    #source-badge {
      font-size: 0.65rem;
      color: var(--text-dim);
      text-align: right;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portfolio</h1>
    <div>
      <button class="btn" onclick="fetchPrices()">↻ Refresh</button>
      <button class="btn" onclick="toggleEdit()">Edit</button>
    </div>
  </header>

  <div id="error-banner"></div>
  <div id="source-badge"></div>

  <main id="holdings-list"></main>

  <div id="edit-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-family:'Syne';">Edit Holdings</h3>
      <button class="btn" onclick="toggleEdit()">Done</button>
    </div>
    <table id="edit-table">
      <thead>
        <tr><th>Ticker</th><th>Name</th><th>Alloc %</th></tr>
      </thead>
      <tbody id="edit-tbody"></tbody>
    </table>
    <button class="btn" style="margin-top:12px; width:100%;" onclick="saveHoldings()">Save & Reload</button>
  </div>

  <script>
    const DEFAULT_HOLDINGS = [
      { ticker: '^GSPC', name: 'S&P 500 (ref)',         alloc: 0     },
      { ticker: 'VTSAX', name: 'Vanguard Total Stock',   alloc: 81    },
      { ticker: 'NOW',   name: 'ServiceNow',             alloc: 9     },
      { ticker: 'FHAPX', name: '401K',                   alloc: 9     },
      { ticker: 'CEG',   name: 'Constellation Energy',   alloc: 0.25  },
      { ticker: 'MU',    name: 'Micron Technology',      alloc: 0.25  },
      { ticker: 'POWL',  name: 'Powell Industries',      alloc: 0.125 },
      { ticker: 'GRID',  name: 'First Trust Grid ETF',   alloc: 0.125 },
      { ticker: 'VOLT',  name: '',                       alloc: 0.083 },
      { ticker: 'URA',   name: 'Uranium ETF',            alloc: 0.083 },
      { ticker: 'DRAM',  name: '',                       alloc: 0.083 },
      { ticker: 'DTCR',  name: '',                       alloc: 0.083 },
    ];

    const COST_BASIS = {
      'NOW': 101, 'CEG': 305.68, 'MU': 504.1,
      'POWL': 255, 'GRID': 185.2, 'VOLT': 38.5, 'URA': 54.46,
    };
    const AUTO_BASIS_TICKERS = ['DRAM'];
    const HOLDINGS_VERSION = '12';

    let holdings = JSON.parse(localStorage.getItem('pt_holdings')) || DEFAULT_HOLDINGS;
    if (localStorage.getItem('pt_v') !== HOLDINGS_VERSION) {
      holdings = DEFAULT_HOLDINGS;
      localStorage.setItem('pt_holdings', JSON.stringify(DEFAULT_HOLDINGS));
      localStorage.setItem('pt_v', HOLDINGS_VERSION);
    }

    let autoBasis = JSON.parse(localStorage.getItem('pt_auto_basis')) || {};

    // Which proxy won last time — start with it next refresh
    let preferredProxy = localStorage.getItem('pt_preferred_proxy') || null;

    const TIMEOUT_MS = 4000;

    function fetchWithTimeout(url, opts = {}) {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      return fetch(url, { ...opts, signal: ctrl.signal })
        .finally(() => clearTimeout(id));
    }

    function parseYahooV8(json) {
      try {
        const result = json?.chart?.result?.[0];
        if (!result) return null;
        const meta = result.meta;
        const price = meta.regularMarketPrice;
        const prevClose = meta.chartPreviousClose || meta.previousClose;
        if (!price || price === 0) return null;
        return { price, prevClose };
      } catch { return null; }
    }

    function makeYahooUrl(ticker) {
      const sym = encodeURIComponent(ticker);
      return `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=2d`;
    }

    async function tryProxy(proxyName, ticker) {
      const target = makeYahooUrl(ticker);
      let url;
      if (proxyName === 'allorigins') {
        url = `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
      } else if (proxyName === 'corsproxy') {
        url = `https://corsproxy.io/?${encodeURIComponent(target)}`;
      } else if (proxyName === 'codetabs') {
        url = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(target)}`;
      }
      try {
        const res = await fetchWithTimeout(url);
        if (!res.ok) return null;
        const json = await res.json();
        const data = parseYahooV8(json);
        return data ? { ...data, src: proxyName } : null;
      } catch { return null; }
    }

    // Race all proxies — return first valid response
    async function fetchYahooRace(ticker) {
      const proxies = ['allorigins', 'corsproxy', 'codetabs'];

      // Put preferred proxy first if we have one
      if (preferredProxy && proxies.includes(preferredProxy)) {
        const idx = proxies.indexOf(preferredProxy);
        proxies.splice(idx, 1);
        proxies.unshift(preferredProxy);
      }

      return new Promise((resolve) => {
        let settled = false;
        let remaining = proxies.length;

        proxies.forEach(proxy => {
          tryProxy(proxy, ticker).then(result => {
            remaining--;
            if (result && !settled) {
              settled = true;
              resolve(result);
            } else if (remaining === 0 && !settled) {
              resolve(null);
            }
          });
        });
      });
    }

    async function fetchStooq(ticker) {
      try {
        const symbol = (ticker === '^GSPC') ? '.inx' : ticker.toLowerCase() + '.us';
        const target = `https://stooq.com/q/l/?s=${symbol}&f=sd2c4&e=csv`;
        const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(target)}`;
        const res = await fetchWithTimeout(url);
        if (!res.ok) return null;
        const text = await res.text();
        const lines = text.trim().split('\n');
        if (lines.length < 2) return null;
        const cols = lines[1].split(',');
        const price = parseFloat(cols[3]);
        const prevClose = parseFloat(cols[2]);
        if (!isNaN(price) && price > 0) {
          return { price, prevClose: isNaN(prevClose) ? price : prevClose, src: 'stooq' };
        }
      } catch { return null; }
      return null;
    }

    async function fetchPrice(ticker) {
      // Race all Yahoo proxies simultaneously
      const data = await fetchYahooRace(ticker);
      if (data) {
        // Remember which proxy won for next time
        if (data.src !== preferredProxy) {
          preferredProxy = data.src;
          localStorage.setItem('pt_preferred_proxy', preferredProxy);
        }
        return data;
      }
      // Last resort: Stooq
      return await fetchStooq(ticker);
    }

    function renderLoading() {
      const list = document.getElementById('holdings-list');
      list.innerHTML = holdings.map(h => `
        <div class="card shimmer">
          <div>
            <div class="ticker-symbol">${h.ticker}</div>
            <div class="ticker-name">${h.name || h.ticker}</div>
          </div>
          <div>
            <div class="price-val">--.--</div>
          </div>
        </div>
      `).join('');
    }

    async function fetchPrices() {
      renderLoading();
      document.getElementById('error-banner').style.display = 'none';
      document.getElementById('source-badge').textContent = '';

      let failedCount = 0;
      const results = [];
      const sources = new Set();

      // Fetch all tickers in parallel
      const fetches = holdings.map(h => fetchPrice(h.ticker));
      const dataArr = await Promise.all(fetches);

      dataArr.forEach((data, i) => {
        if (!data) { failedCount++; } else { sources.add(data.src); }
        results.push({ ...holdings[i], data });
      });

      if (failedCount > 0) {
        const banner = document.getElementById('error-banner');
        banner.style.display = 'block';
        banner.textContent = `${failedCount} ticker(s) unavailable.`;
      }

      if (sources.size > 0) {
        document.getElementById('source-badge').textContent =
          `data via ${[...sources].join(', ')} · ${new Date().toLocaleTimeString()}`;
      }

      render(results);
    }

    function render(data) {
      const list = document.getElementById('holdings-list');
      list.innerHTML = data.map(item => {
        const price = item.data?.price;
        let changeText = 'N/A';
        let changeClass = '';

        if (price) {
          if (AUTO_BASIS_TICKERS.includes(item.ticker) && !autoBasis[item.ticker]) {
            autoBasis[item.ticker] = price;
            localStorage.setItem('pt_auto_basis', JSON.stringify(autoBasis));
          }

          const basis = COST_BASIS[item.ticker] || autoBasis[item.ticker];

          if (basis) {
            const pct = ((price - basis) / basis) * 100;
            changeClass = pct >= 0 ? 'pos' : 'neg';
            changeText = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% vs basis`;
          } else if (item.data?.prevClose) {
            const pct = ((price - item.data.prevClose) / item.data.prevClose) * 100;
            changeClass = pct >= 0 ? 'pos' : 'neg';
            changeText = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% 1d`;
          }
        }

        return `
          <div class="card">
            <div>
              <div class="ticker-symbol">${item.ticker}</div>
              <div class="ticker-name">${item.name || item.ticker}</div>
            </div>
            <div>
              <div class="price-val">${price ? '$' + price.toFixed(2) : 'Unavailable'}</div>
              <div class="price-change ${changeClass}">${changeText}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEdit() {
      const panel = document.getElementById('edit-panel');
      panel.classList.toggle('active');
      if (panel.classList.contains('active')) {
        const tbody = document.getElementById('edit-tbody');
        tbody.innerHTML = holdings.map((h, i) => `
          <tr>
            <td><input value="${h.ticker}" id="t_${i}"></td>
            <td><input value="${h.name}" id="n_${i}"></td>
            <td><input type="number" step="0.01" value="${h.alloc}" id="a_${i}"></td>
          </tr>
        `).join('');
      }
    }

    function saveHoldings() {
      holdings = holdings.map((_, i) => ({
        ticker: document.getElementById(`t_${i}`).value.toUpperCase(),
        name: document.getElementById(`n_${i}`).value,
        alloc: parseFloat(document.getElementById(`a_${i}`).value) || 0
      }));
      localStorage.setItem('pt_holdings', JSON.stringify(holdings));
      toggleEdit();
      fetchPrices();
    }

    fetchPrices();
    setInterval(fetchPrices, 60000);
  </script>
</body>
</html>
