<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1e;
      --card-bg: #131b2e;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --border: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
    }

    .btn:hover { border-color: var(--accent); }

    #error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      margin-bottom: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ticker-symbol {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .ticker-name {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .price-val {
      font-size: 1rem;
      text-align: right;
    }

    .price-change {
      font-size: 0.75rem;
      text-align: right;
    }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .shimmer {
      background: linear-gradient(90deg, var(--card-bg) 0%, #1c273e 50%, var(--card-bg) 100%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    #edit-panel {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 2px solid var(--accent);
      padding: 20px;
      max-height: 80vh;
      overflow-y: auto;
      transition: bottom 0.3s ease;
      box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
      z-index: 100;
    }

    #edit-panel.active { bottom: 0; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; text-align: left; font-size: 0.8rem; }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px;
      width: 100%;
      border-radius: 4px;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <header>
    <h1>Portfolio</h1>
    <div>
      <button class="btn" onclick="fetchPrices()">↻ Refresh</button>
      <button class="btn" onclick="toggleEdit()">Edit</button>
    </div>
  </header>

  <div id="error-banner">Some tickers could not be updated.</div>

  <main id="holdings-list"></main>

  <div id="edit-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <h3 style="font-family:'Syne';">Edit Holdings</h3>
      <button class="btn" onclick="toggleEdit()">Done</button>
    </div>
    <table id="edit-table">
      <thead>
        <tr><th>Ticker</th><th>Name</th><th>Alloc %</th></tr>
      </thead>
      <tbody id="edit-tbody"></tbody>
    </table>
    <button class="btn" style="margin-top:12px; width:100%;" onclick="saveHoldings()">Save & Reload</button>
  </div>

  <script>
    const API_KEY = 'dam9sf1r01qvokaqo6q0dam9sf1r01qvokaqo6qg';

    const DEFAULT_HOLDINGS = [
      { ticker: '^GSPC', name: 'S&P 500 (ref)',         alloc: 0     },
      { ticker: 'VTSAX', name: 'Vanguard Total Stock',   alloc: 81    },
      { ticker: 'NOW',   name: 'ServiceNow',             alloc: 9     },
      { ticker: 'FHAPX', name: '401K',                   alloc: 9     },
      { ticker: 'CEG',   name: 'Constellation Energy',   alloc: 0.25  },
      { ticker: 'MU',    name: 'Micron Technology',      alloc: 0.25  },
      { ticker: 'POWL',  name: 'Powell Industries',      alloc: 0.125 },
      { ticker: 'GRID',  name: 'First Trust Grid ETF',   alloc: 0.125 },
      { ticker: 'VOLT',  name: '',                       alloc: 0.083 },
      { ticker: 'URA',   name: 'Uranium ETF',            alloc: 0.083 },
      { ticker: 'DRAM',  name: '',                       alloc: 0.083 },
      { ticker: 'DTCR',  name: '',                       alloc: 0.083 },
    ];

    // Tickers routed to Stooq for exact values (Index level + Mutual Fund NAVs)
    const STOOQ_DIRECT = ['^GSPC', 'VTSAX', 'FHAPX'];

    const COST_BASIS = {
      'NOW': 101, 'CEG': 305.68, 'MU': 504.1,
      'POWL': 255, 'GRID': 185.2, 'VOLT': 38.5, 'URA': 54.46,
    };
    const AUTO_BASIS_TICKERS = ['DRAM'];
    const HOLDINGS_VERSION = '9';

    let holdings = JSON.parse(localStorage.getItem('pt_holdings')) || DEFAULT_HOLDINGS;
    if (localStorage.getItem('pt_v') !== HOLDINGS_VERSION) {
      holdings = DEFAULT_HOLDINGS;
      localStorage.setItem('pt_holdings', JSON.stringify(DEFAULT_HOLDINGS));
      localStorage.setItem('pt_v', HOLDINGS_VERSION);
    }

    let autoBasis = JSON.parse(localStorage.getItem('pt_auto_basis')) || {};

    // Stooq CSV Fetcher for Index & Mutual Funds
    async function fetchStooqData(ticker) {
      try {
        const cleanSymbol = ticker === '^GSPC' ? '^spx' : ticker.toLowerCase() + '.us';
        const res = await fetch(`https://stooq.com/q/l/?s=${cleanSymbol}&f=sdlw2&e=csv`);
        if (res.ok) {
          const csvText = await res.text();
          const lines = csvText.trim().split('\n');
          if (lines.length > 1) {
            const data = lines[1].split(',');
            const price = parseFloat(data[3]);
            if (!isNaN(price) && price > 0) {
              return { price, prevClose: price };
            }
          }
        }
      } catch (e) {}
      return null;
    }

    async function fetchPrice(ticker) {
      // 1. Direct Stooq query for ^GSPC, VTSAX, and FHAPX
      if (STOOQ_DIRECT.includes(ticker)) {
        const stooqData = await fetchStooqData(ticker);
        if (stooqData) return stooqData;
      }

      // 2. Finnhub query for remaining stocks and ETFs
      try {
        const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${API_KEY}`);
        if (!res.ok) return null;
        const data = await res.json();
        
        if (data.c && data.c !== 0) {
          return { price: data.c, prevClose: data.pc };
        }
      } catch (e) {
        console.error(`Error fetching ${ticker}:`, e);
      }
      return null;
    }

    function renderLoading() {
      const list = document.getElementById('holdings-list');
      list.innerHTML = holdings.map(h => `
        <div class="card shimmer">
          <div>
            <div class="ticker-symbol">${h.ticker}</div>
            <div class="ticker-name">${h.name || h.ticker}</div>
          </div>
          <div>
            <div class="price-val">--.--</div>
          </div>
        </div>
      `).join('');
    }

    async function fetchPrices() {
      renderLoading();
      document.getElementById('error-banner').style.display = 'none';

      let failedCount = 0;
      const results = [];
      for (const h of holdings) {
        const data = await fetchPrice(h.ticker);
        if (!data) failedCount++;
        results.push({ ...h, data });
        await new Promise(r => setTimeout(r, 60));
      }

      if (failedCount > 0) {
        document.getElementById('error-banner').style.display = 'block';
      }

      render(results);
    }

    function render(data) {
      const list = document.getElementById('holdings-list');
      list.innerHTML = data.map(item => {
        const price = item.data?.price;
        let changeText = 'N/A';
        let changeClass = '';

        if (price) {
          if (AUTO_BASIS_TICKERS.includes(item.ticker) && !autoBasis[item.ticker]) {
            autoBasis[item.ticker] = price;
            localStorage.setItem('pt_auto_basis', JSON.stringify(autoBasis));
          }

          const basis = COST_BASIS[item.ticker] || autoBasis[item.ticker];
          
          if (basis) {
            const pct = ((price - basis) / basis) * 100;
            changeClass = pct >= 0 ? 'pos' : 'neg';
            changeText = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% (vs basis)`;
          } else if (item.data.prevClose) {
            const pct = ((price - item.data.prevClose) / item.data.prevClose) * 100;
            changeClass = pct >= 0 ? 'pos' : 'neg';
            changeText = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}% (1d)`;
          }
        }

        return `
          <div class="card">
            <div>
              <div class="ticker-symbol">${item.ticker}</div>
              <div class="ticker-name">${item.name || item.ticker}</div>
            </div>
            <div>
              <div class="price-val">${price ? '$' + price.toFixed(2) : 'Unavailable'}</div>
              <div class="price-change ${changeClass}">${changeText}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleEdit() {
      const panel = document.getElementById('edit-panel');
      panel.classList.toggle('active');
      if (panel.classList.contains('active')) {
        const tbody = document.getElementById('edit-tbody');
        tbody.innerHTML = holdings.map((h, i) => `
          <tr>
            <td><input value="${h.ticker}" id="t_${i}"></td>
            <td><input value="${h.name}" id="n_${i}"></td>
            <td><input type="number" step="0.01" value="${h.alloc}" id="a_${i}"></td>
          </tr>
        `).join('');
      }
    }

    function saveHoldings() {
      holdings = holdings.map((_, i) => ({
        ticker: document.getElementById(`t_${i}`).value.toUpperCase(),
        name: document.getElementById(`n_${i}`).value,
        alloc: parseFloat(document.getElementById(`a_${i}`).value) || 0
      }));
      localStorage.setItem('pt_holdings', JSON.stringify(holdings));
      toggleEdit();
      fetchPrices();
    }

    fetchPrices();
    setInterval(fetchPrices, 60000);
  </script>
</body>
</html>
